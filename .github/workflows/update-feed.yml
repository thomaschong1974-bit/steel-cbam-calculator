name: update-feed

# 每天自动刷新 feed.json: 欧委会 CBAM 证书价 + SMM 快讯
# 也可以在 Actions 页面点 "Run workflow" 手动跑一次
on:
  schedule:
    - cron: '0 6 * * *'      # 每天 UTC 06:00 = 北京时间 14:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update feed.json
        run: python scripts/update_feed.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain feed.json)" ]; then
            git config user.name  "smm-feed-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.json
            git commit -m "chore(feed): auto-update $(date -u +%F)"
            git push
            echo "pushed"
          else
            echo "no change - nothing to push"
          fi
